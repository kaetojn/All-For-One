# All For One: one Worker serves the web app (public/), the API and the Claude connector.
# Secrets set in the Cloudflare dashboard are left as they are.
name = "all-for-one"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "all-for-one"
database_id = "dab70f65-ac31-4ed6-9611-f3048228292a"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "all-for-one-photos"

# Reminders: check every 15 minutes whether one is due.
[triggers]
crons = ["*/15 * * * *"]
